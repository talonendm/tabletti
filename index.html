<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9cf">


    <title>Keittiön tabletti</title>
    <style>
        :root {
            --bg: #111;
            --fg: #f5f5f5;
            --accent: #9cf;
            --card: #222;
        }

        body.light {
            --bg: #fafafa;
            --fg: #111;
            --accent: #0056cc;
            --card: #fff;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
            transition: background 0.6s, color 0.6s;
        }

        body {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.5rem;
        }

        header {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
        }

        #header-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 0.3rem;
            font-size: 0.9rem;
        }

        /* Säät */
        .weather-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 0.5rem;
        }

        .weather-box {
            flex: 1;
            min-width: 120px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.8rem;
            padding: 0.5rem;
            text-align: center;
        }

        /* Kuvaboksi + uutiset/HSL */
        .main-section {
            display: flex;
            gap: 0.5rem;
        }

        .photo-box {
            position: relative;
            width: 40%;
            padding-top: 40%;
            border-radius: 1rem;
            overflow: hidden;
            background: #000;
        }

        .photo-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.6s;
        }

        .news-box {
            flex: 1;
            min-width: 200px;
            background: var(--card);
            border-radius: 0.8rem;
            padding: 0.5rem;
            max-height: 500px;
            overflow-y: auto;
        }

        .news-box h2 {
            margin-top: 0;
            color: var(--accent);
        }

        .news-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .news-box li {
            margin-bottom: 0.4rem;
        }

        .news-box a {
            color: var(--accent);
            text-decoration: none;
        }

        .news-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header>
        <div>Keittiön tabletti</div>
        <div id="header-bottom">
            <div id="clock"></div>
            <div id="note"></div>
        </div>
    </header>

    <!-- Säät -->
    <section class="weather-container" id="weatherContainer">
        <div>Loading weather...</div>
    </section>

    <!-- Kuvaboksi + uutiset/HSL -->
    <section class="main-section">
        <div class="photo-box"><img id="photo" src="" alt="Kuva ladataan..."></div>
        <div class="news-box">

            <h2>HSL-pysäkit</h2>
            <ul>
                <li><a href="https://reittiopas.hsl.fi/pysakit/HSL%3A6070227" target="_blank">Syväjärvi keskustaan</a>
                </li>
                <li><a href="https://reittiopas.hsl.fi/pysakit/HSL%3A6070241" target="_blank">Syväjärvi Kantvikiin</a>
                </li>
                <li><a href="https://reittiopas.hsl.fi/terminaalit/HSL%3A6000001" target="_blank">Kirkkonummi
                        Matkakeskus</a></li>
                <li><a href="https://reittiopas.hsl.fi/terminaalit/HSL%3A6000205" target="_blank">Kirkkonummen
                        juna-asema</a></li>
            </ul>
            <h2>Uutiset</h2>
            <div id="newsList">Ladataan...</div>
            <div style="font-size:0.7rem; text-align:center; margin-top:0.3rem;">
                Weather data provided by
                <a href="https://openweathermap.org/" target="_blank" style="color:var(--accent)">
                    OpenWeather <img src="logoopenweather.png" alt="OpenWeatherMap" style="height:20px; vertical-align:middle;">

                </a>
            </div>


        </div>
    </section>

    <script>
        /* -------------------- Teema -------------------- */
        function setTheme() {
            const hour = new Date().getHours();
            const isDay = hour >= 7 && hour < 19;
            document.body.classList.toggle("light", isDay);
        }
        setTheme(); setInterval(setTheme, 600000);

        /* -------------------- Kello + note -------------------- */
        const NOTE_JSON_URL = "notes.json";
        let notes = [];
        async function loadNotes() { try { const res = await fetch(NOTE_JSON_URL + "?t=" + Date.now()); notes = await res.json(); } catch { notes = []; } }
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById("clock").textContent = now.toLocaleDateString("fi-FI", options);
            const todayStr = now.toISOString().split('T')[0];
            const note = notes.find(n => n.date === todayStr);
            document.getElementById("note").textContent = note ? note.text : "";
        }
        loadNotes(); setInterval(updateClock, 1000);

        /* -------------------- Kuvaboksi -------------------- */
        const IMAGES_JSON_URL = "images.json";
        const IMAGE_BASE_URL = "images/";
        const photoEl = document.getElementById("photo");
        let images = [], index = 0;
        async function loadImages() {
            try {
                const res = await fetch(IMAGES_JSON_URL + "?t=" + Date.now()); const data = await res.json();
                images = data.map(x => x.startsWith("http") ? x : IMAGE_BASE_URL + x); if (images.length) showImage();
            } catch { photoEl.alt = "Kuvien lataus epäonnistui"; }
        }
        function showImage() { if (!images.length) return; photoEl.style.opacity = 0; setTimeout(() => { photoEl.src = images[index] + "?t=" + Date.now(); photoEl.style.opacity = 1; index = (index + 1) % images.length; }, 500); }
        loadImages(); setInterval(showImage, 60000);

        /* -------------------- Sää (OpenWeatherMap) -------------------- */
        const API_KEY = "51002..."; // disabled - using https://dash.cloudflare.com/workers/tabletti-saaa
        const LOCATIONS = ["Kirkkonummi", "Espoo", "Helsinki", "Saariselkä", "Panelia", "Imatra", "Kööpenhamina"];
        const container = document.getElementById("weatherContainer");

        async function fetchWeather() {
            container.innerHTML = "";
            for (const city of LOCATIONS) {
                try {
                    const res = await fetch(`https://tabletti-saaa.talonen-dm.workers.dev/weather?city=${encodeURIComponent(city)}`);
                    const data = await res.json();
                    const box = document.createElement("div");
                    box.className = "weather-box";
                    box.innerHTML = `<strong>${data.name}</strong><br>${data.weather[0].description}<br>🌡️ ${data.main.temp.toFixed(1)} °C<br>💨 ${data.wind.speed} m/s`;

                    // Ennuste (forecast, 5 päivän)
                    const fRes = await fetch(`https://tabletti-saaa.talonen-dm.workers.dev/forecast?city=${encodeURIComponent(city)}`);
                    const fData = await fRes.json();
                    const next3 = fData.list.slice(0, 3).map(x => `${x.dt_txt}: ${x.main.temp.toFixed(1)} °C`).join("<br>");
                    box.innerHTML += `<br><em>Ennuste:</em><br>${next3}`;

                    // Ilmanlaatu (air)
                    const lat = data.coord.lat, lon = data.coord.lon;
                    const aRes = await fetch(`https://tabletti-saaa.talonen-dm.workers.dev/air?lat=${lat}&lon=${lon}`);
                    const aData = await aRes.json();
                    box.innerHTML += `<br><em>Ilmanlaatu:</em> PM2.5 ${aData.list[0].components.pm2_5} μg/m³`;

                    container.appendChild(box);
                } catch { const box = document.createElement("div"); box.className = "weather-box"; box.textContent = `${city}: ei saatavilla`; container.appendChild(box); }
            }
        }
        fetchWeather();
        // setInterval(fetchWeather, 600000);
        setInterval(fetchWeather, 15 * 60 * 1000); // 15 minuutin välein


        /* -------------------- Uutiset (Yle RSS) -------------------- */
        async function fetchRSS(rssUrl, name) {
            const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            try {
                const res = await fetch(url); const data = await res.json();
                return `<h3>${name}</h3><ul>` + data.items.slice(0, 12).map(i => `<li><a href="${i.link}" target="_blank">${i.title}</a></li>`).join("") + "</ul>";
            } catch { return `<p>${name}: ei saatavilla</p>`; }
        }
        async function fetchNews() {
            const yle = await fetchRSS("https://feeds.yle.fi/uutiset/v1/majorHeadlines/YLE_UUTISET.rss", "Yle");
            document.getElementById("newsList").innerHTML = yle;
        }
        fetchNews(); setInterval(fetchNews, 900000);

    </script>
</body>

</html>
