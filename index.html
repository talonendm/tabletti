<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9cf">


    <title>Keittiön tabletti</title>
    <style>
        :root {
            --bg: #111;
            --fg: #f5f5f5;
            --accent: #9cf;
            --card: #222;
            --photo-scale: 0.96;
            /* kuvan korkeuden säätö, 1.0 = täysi */
        }

        body.light {
            --bg: #fafafa;
            --fg: #111;
            --accent: #0056cc;
            --card: #fff;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
            transition: background 0.6s ease, color 0.6s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0.5rem;
        }

        header {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
        }

        #header-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 0.3rem;
            font-size: 0.9rem;
        }

        section {
            background: var(--card);
            border-radius: 1rem;
            padding: 0.5rem;
            overflow: hidden;
            flex-shrink: 0;
        }

        h2 {
            margin: 0.2rem 0 0.5rem 0;
            color: var(--accent);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 0.4rem;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Kuvaboksi */
        .photo-box {
            position: relative;
            width: 25%;
            /* hieman kapeampi */
            padding-top: calc(25% * var(--photo-scale));
            /* korkeuden skaalaus suhteessa leveyteen */
            border-radius: 1rem;
            overflow: hidden;
            background: #000;
        }


        .photo-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 94%;
            height: 94%;
            object-fit: cover;
            transition: opacity 0.6s;
        }

        #themeToggle {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: var(--card);
            color: var(--accent);
            border: none;
            border-radius: 0.5rem;
            padding: 0.3rem 0.6rem;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s, color 0.3s;
        }

        #themeToggle:hover {
            background: var(--accent);
            color: var(--card);
        }


        /* Sääkortit */
        .weather-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 0.5rem;
        }

        .weather-box {
            flex: 1;
            min-width: 120px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.8rem;
            padding: 0.5rem;
            text-align: center;
        }

        /* HSL + koulu aikataulut vieretysten */
        .info-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .info-card {
            flex: 1;
            min-width: 120px;
            background: var(--card);
            border-radius: 1rem;
            padding: 0.3rem 0.5rem;
            /* pienempi padding */
        }

        #google-docs iframe {
            border-radius: 0.5rem;
        }

        @media (max-width: 1200px) {
            .info-row {
                flex-direction: column;
            }
        }



        .main-section {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: flex-start;
            /* yläreunassa linjassa */
        }

        .news-box {
            flex: 1;
            min-width: 250px;
            /* minimileveys uutisille/HSL */
        }


        .info-card {
            flex: 1;
            min-width: 200px;
            background: var(--card);
            border-radius: 1rem;
            padding: 0.8rem;
        }

        #news {
            flex-grow: 1;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <header style="position:relative; height:3.5rem; display:flex; justify-content:center; align-items:center;">

        <!-- Vasemmalla: OpenWeather logo -->
        <div style="position:absolute; left:0.5rem; top:50%; transform:translateY(-50%); font-size:0.7rem;">
            Weather data provided by
            <a href="https://openweathermap.org/" target="_blank" style="color:var(--accent); text-decoration:none;">
                OpenWeather <img src="logoopenweather.png" alt="OpenWeatherMap"
                    style="height:20px; vertical-align:middle;">
            </a>
        </div>

        <!-- Keskellä: Otsikko + kello + note -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:0.2rem;">
            <div style="font-weight:bold; font-size:1.6rem;">Keittiön tabletti</div>
            <div style="display:flex; gap:1rem; font-size:0.9rem;">
                <div id="clock"></div>
                <div id="note"></div>
            </div>
        </div>

        <!-- Oikeassa yläkulmassa: Teeman vaihto nappi -->
        <button id="themeToggle" title="Vaihda teema"
            style="position:absolute; right:0.5rem; top:50%; transform:translateY(-50%);">
            🌙
        </button>

    </header>




    <!-- Säät -->
    <section class="weather-container" id="weatherContainer">
        <div>Loading weather...</div>
    </section>

    <section class="main-section" style="display:flex; gap:1rem; flex-wrap:wrap;">
        <!-- Vasemman puolen kuva -->
        <div class="photo-box" style="flex:1; min-width:120px;">
            <img id="photo" src="" alt="Kuva ladataan..." style="width:100%; height:auto; border-radius:1rem;">
        </div>

        <div class="news-box">
            <div class="info-row">
                <!-- HSL-kortti -->
                <div class="info-card" style="background:#a3c4f3; color:#111;">
                    <ul>
                        <li><a href="https://reittiopas.hsl.fi/pysakit/HSL%3A6070227" target="_blank">Syväjärvi
                                keskustaan</a></li>
                        <li><a href="https://reittiopas.hsl.fi/pysakit/HSL%3A6070241" target="_blank">Syväjärvi
                                Kantvikiin</a></li>
                        <li><a href="https://reittiopas.hsl.fi/terminaalit/HSL%3A6000001" target="_blank">Kirkkonummi
                                Matkakeskus</a></li>
                        <li><a href="https://reittiopas.hsl.fi/terminaalit/HSL%3A6000205" target="_blank">Kirkkonummen
                                juna-asema</a></li>
                    </ul>
                </div>

                <!-- Kouluajat lapsille -->
                <div class="info-card" style="background:#f7d794; color:#111;">
                    <h3>Va</h3>
                    <div id="vaSchedule">Ladataan...</div>
                </div>
                <div class="info-card" style="background:#c7ecee; color:#111;">
                    <h3>Ve</h3>
                    <div id="veSchedule">Ladataan...</div>
                </div>

                <!-- Google Docs -->
                <div class="info-card" style="background:#f1f2f6; color:#111; min-width:250px; max-width:300px;">
                    <iframe
                        src="https://docs.google.com/document/d/e/2PACX-1vR2we_YLjOsGCL10VOvdcpTo3P2wGvWLFkXPsf5HWke2NmZnxr3WdzhCFfmYhhKTlRXdY3e06HhqeRL/pub?embedded=true"
                        style="width:100%; height:100px; border:none;"></iframe>
                </div>
            </div>

            <!-- Uutiset -->
            <div id="newsList">Ladataan...</div>
        </div>

    </section>



    <script>
        /* --------------------
   Wake Lock + Teema
-------------------- */

        let wakeLock = null;
        let manualTheme = null; // null = automaattinen
        const toggleBtn = document.getElementById("themeToggle");
        // Pyydä Wake Lock vain, kun sivu on näkyvissä:
        async function requestWakeLock() {
            if (document.visibilityState !== 'visible') return; // ei taustalla
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('Wake Lock aktiivinen');
                wakeLock.addEventListener('release', () => {
                    console.log('Wake Lock vapautettu');
                });
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        // pyydetään heti näkyessä
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        // myös ensimmäinen kutsu
        requestWakeLock();


        // Pyydetään uudelleen, jos välilehti palautuu näkyviin
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
                setTheme(); // päivitetään myös teema
            }
        });

        // --- Päivä/yö-teema ---
        function setTheme() {
            if (manualTheme) return; // jos käyttäjä valinnut
            const hour = new Date().getHours();
            const isDay = hour >= 7 && hour < 19;
            document.body.classList.toggle("light", isDay);
            toggleBtn.textContent = isDay ? "☀️" : "🌙";
        }

        // --- Aurinko/kuu-painike ---
        toggleBtn.addEventListener("click", () => {
            if (manualTheme === "light") {
                document.body.classList.remove("light");
                manualTheme = "dark";
                toggleBtn.textContent = "🌙";
            } else {
                document.body.classList.add("light");
                manualTheme = "light";
                toggleBtn.textContent = "☀️";
            }
        });

        // Ensimmäinen teeman asetus ja ajastus
        setTheme();
        setInterval(setTheme, 10 * 60 * 1000);




        /* -------------------- Kello + note -------------------- */
        const NOTE_JSON_URL = "notes.json";
        let notes = [];
        async function loadNotes() { try { const res = await fetch(NOTE_JSON_URL + "?t=" + Date.now()); notes = await res.json(); } catch { notes = []; } }
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById("clock").textContent = now.toLocaleDateString("fi-FI", options);
            const todayStr = now.toISOString().split('T')[0];
            const note = notes.find(n => n.date === todayStr);
            document.getElementById("note").textContent = note ? note.text : "";
        }
        loadNotes(); setInterval(updateClock, 1000);

        /* -------------------- Kuvaboksi -------------------- */

        // Valitut kuvat:
        const IMAGES_JSON_URL = "images.json";
        const IMAGE_BASE_URL = "images/";
        const photoEl = document.getElementById("photo");
        let images = [], index = 0;
        async function loadImages() {
            try {
                const res = await fetch(IMAGES_JSON_URL + "?t=" + Date.now()); const data = await res.json();
                images = data.map(x => x.startsWith("http") ? x : IMAGE_BASE_URL + x); if (images.length) showImage();
            } catch { photoEl.alt = "Kuvien lataus epäonnistui"; }
        }
        function showImage() { if (!images.length) return; photoEl.style.opacity = 0; setTimeout(() => { photoEl.src = images[index] + "?t=" + Date.now(); photoEl.style.opacity = 1; index = (index + 1) % images.length; }, 500); }
        loadImages(); setInterval(showImage, 60000);

        /* -------------------- Sää (OpenWeatherMap) -------------------- */
        const API_KEY = "51002..."; // disabled - using https://dash.cloudflare.com/workers/tabletti-saaa
        const LOCATIONS = ["Kirkkonummi", "Helsinki", "Panelia", "Imatra", "Saariselkä"];
        const container = document.getElementById("weatherContainer");

        async function fetchWeather() {
            container.innerHTML = "";
            for (const city of LOCATIONS) {
                try {
                    const res = await fetch(`https://tabletti-saaa.talonen-dm.workers.dev/weather?city=${encodeURIComponent(city)}`);
                    const data = await res.json();
                    const box = document.createElement("div");
                    box.className = "weather-box";
                    box.innerHTML = `<strong>${data.name}</strong><br>${data.weather[0].description}<br>🌡️ ${data.main.temp.toFixed(1)} °C 💨 ${data.wind.speed} m/s`;

                    // Ennuste (forecast, 5 päivän)
                    const fRes = await fetch(`https://tabletti-saaa.talonen-dm.workers.dev/forecast?city=${encodeURIComponent(city)}`);
                    const fData = await fRes.json();
                    const next3 = fData.list.slice(1, 6).map(x => `${x.dt_txt}: ${x.main.temp.toFixed(1)} °C`).join("<br>");
                    // next skipped (0) but then 5 forecasts shown
                    //box.innerHTML += `<br><em>Ennuste:</em><br>${next3}`;
                    box.innerHTML += `<br>${next3}`;
                    // slice(1,4) → aloitetaan toisesta listan alkiosta (≈ 3 h päästä) ja otetaan kolme seuraavaa ennustetta
                    // dt-kenttä muutetaan selkeäksi kellonajaksi.
                    // Ilmanlaatu (air)
                    const lat = data.coord.lat, lon = data.coord.lon;
                    const aRes = await fetch(`https://tabletti-saaa.talonen-dm.workers.dev/air?lat=${lat}&lon=${lon}`);
                    const aData = await aRes.json();
                    box.innerHTML += `<br><em>Ilmanlaatu:</em> PM2.5 ${aData.list[0].components.pm2_5} μg/m³`;

                    container.appendChild(box);
                } catch { const box = document.createElement("div"); box.className = "weather-box"; box.textContent = `${city}: ei saatavilla`; container.appendChild(box); }
            }
        }
        fetchWeather();
        // setInterval(fetchWeather, 600000);
        setInterval(fetchWeather, 30 * 60 * 1000); // 30 minuutin välein

        // -------------------- Kouluajat (aikataulu.json)
        const scheduleUrl = "aikataulu.json";
        let SCHEDULE_DATA = { children: [] };
        async function loadScheduleData() {
            try {
                const res = await fetch(scheduleUrl + "?t=" + Date.now());
                SCHEDULE_DATA = await res.json();
                renderSchedules();
                setInterval(renderSchedules, 5 * 60 * 1000);
            } catch (e) {
                console.error("Aikataulun lataus epäonnistui:", e);
                document.getElementById("vaSchedule").textContent = "Ei saatavilla";
                document.getElementById("veSchedule").textContent = "Ei saatavilla";
            }
        }
        function renderSchedules() {
            const today = new Date();
            const weekday = today.toLocaleDateString("en-US", { weekday: "long" }).toLowerCase();
            SCHEDULE_DATA.children.forEach(child => {
                const el = document.getElementById(`${child.name}Schedule`);
                if (!el) return;
                const times = child.schedule[weekday];
                if (!times) { el.innerHTML = "Vapaapäivä"; return; }
                const nowMinutes = today.getHours() * 60 + today.getMinutes();
                const startMinutes = parseInt(times.start.split(":")[0]) * 60 + parseInt(times.start.split(":")[1]);
                const endMinutes = parseInt(times.end.split(":")[0]) * 60 + parseInt(times.end.split(":")[1]);
                let status = "";
                if (nowMinutes < startMinutes) { const diff = startMinutes - nowMinutes; status = `Alkaa: ${Math.floor(diff / 60)}h ${diff % 60}min`; }
                else if (nowMinutes >= startMinutes && nowMinutes < endMinutes) { const diff = endMinutes - nowMinutes; status = `Koulussa (${Math.floor(diff / 60)}h ${diff % 60}min jäljellä)`; }
                else { status = "Koulu ohi tältä päivältä"; }
                el.innerHTML = `${times.start} – ${times.end}<br><em>${status}</em>`;
            });
        }
        loadScheduleData();



        /* -------------------- Uutiset (Yle RSS) -------------------- */
        async function fetchRSS(rssUrl, name) {
            const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            try {
                const res = await fetch(url); const data = await res.json();
                return `<h3>${name}</h3><ul>` + data.items.slice(0, 6).map(i => `<li><a href="${i.link}" target="_blank">${i.title}</a></li>`).join("") + "</ul>";
            } catch { return `<p>${name}: ei saatavilla</p>`; }
        }
        async function fetchNews() {
            const yle = await fetchRSS("https://feeds.yle.fi/uutiset/v1/majorHeadlines/YLE_UUTISET.rss", "Yle");
            document.getElementById("newsList").innerHTML = yle;
        }
        fetchNews(); setInterval(fetchNews, 900000);


        document.addEventListener("DOMContentLoaded", () => {
            renderSchedules(); // tai loadSchedule()
        });

    </script>


</body>

</html>
