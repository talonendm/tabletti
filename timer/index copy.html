<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Multi-timer – Keittiön tabletti</title>

<style>
 :root{
  --bg:#0f1720;
  --fg:#eef2ff;
  --card:#111827;
  --accent:#5ad3ff;
  --muted:#9aa7b2;
}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui;
  overflow:hidden;
}

.wrap{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  box-sizing:border-box;
}

/* ---------- SETTINGS PANEL ---------- */
#openSettingsBtn {
  position: fixed;
  right: 15px;
  bottom: 15px;
  font-size: 1.8rem;
  padding: 12px 16px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  z-index: 999;
}

#settingsPanel {
  position: fixed;
  top: 0;
  right: -280px;
  width: 260px;
  height: 100%;
  background: var(--card);
  padding: 14px;
  box-shadow: -4px 0 15px rgba(0,0,0,0.6);
  z-index: 2000;
  transition: right .35s cubic-bezier(.22,.61,.36,1);
}

#settingsPanel.open { right:0; }

.settings-header {
  font-size: 1.4rem;
  font-weight: bold;
  color: var(--accent);
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#closeSettings {
  font-size: 1.6rem;
  background:none;
  border:none;
  color:var(--fg);
  cursor:pointer;
}

.settings-group {
  margin-top: 18px;
  font-size: 1.2rem;
}
.settings-group input[type="number"] {
  width: 100%;
  font-size: 1.3rem;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #fff3;
  background:#0003;
  color:var(--fg);
}

.settings-group input[type="checkbox"] {
  transform: scale(1.2);
  margin-right:6px;
}

.stats {
  font-size: 0.9rem;
  color: var(--muted);
  margin-top: 6px;
  text-align: center;
  line-height: 1.2em;
}

/* ---------- TIMER LAYOUT ---------- */
.center {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.circle {
  position:relative;
  background: var(--card);
  border-radius:50%;
}

/* ISO JA SELKEÄ NAPPI */
.timer {
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,255,255,0.12);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--fg);
  padding:6px;
  text-align:center;
  cursor:pointer;   /* koko elementti nappi */
  transition: transform 0.15s, background 0.2s;
}

.timer.running {
  background:#ff4d4f; /* STOP väri */
  color:#fff;
}

.timer.loaded{
  animation: popin 0.3s ease forwards;
}


.title{
  font-size:1.2rem;
  color:var(--muted);
  margin-bottom:4px;
}

.time{
  font-size:2rem;
  font-weight:bold;
}

.btnStart{
  margin-top:6px;
  padding:6px 12px;
  background:var(--accent);
  border:none;
  border-radius:16px;
  color:#000;
  cursor:pointer;
  transition: transform 0.15s, background 0.2s;
}

.btnStart:active{
  transform: scale(0.9);
}

.btnStart.stop{
  background: #ff4d4f; /* punainen STOP */
  color: #fff;
}

.timer.loaded{
  animation: popin 0.3s ease forwards;
}

@keyframes popin {
  0% { transform: translate(-50%, -50%) scale(0.1); opacity:0; }
  80% { transform: translate(-50%, -50%) scale(1.1); opacity:1; }
  100% { transform: translate(-50%, -50%) scale(1); }
}




</style>
</head>

<body>

<div class="wrap" id="app">
  <main class="center">
    <div class="circle" id="circle"></div>
  </main>
</div>

<!-- ---------- SETTINGS PANEL ---------- -->
<div id="settingsPanel">
    <div class="settings-header">
        Asetukset
        <button id="closeSettings">✕</button>
    </div>

    <div class="settings-group">
        <label>Ajastimien määrä</label>
        <input id="timerCountInput" type="number" min="2" max="8">
    </div>

    <div class="settings-group">
        <label><input id="tiltLockInput" type="checkbox"> Pakota vaakasuunta</label>
    </div>

    <div class="settings-group">
        <label><input id="wakeLockInput" type="checkbox"> Näyttö ei sammu</label>
    </div>
</div>

<button id="openSettingsBtn">⚙️</button>

<script>
/* ---------------- STATE ---------------- */
let state = {
  timerCount: 4,
  timers: [],
  tiltLock: true,
  wakeLockEnabled:false
};

/* ---------------- TIMER INIT ---------------- */
function createTimer(id){ 
  return {id,running:false,startTs:0,elapsed:0,total:0,over15:0,over60:0}; 
}
function initTimers(count){
  state.timerCount = count;
  state.timers = [];
  for(let i=0;i<count;i++) state.timers.push(createTimer(i));
}

/* ---------------- TIMER RENDER ---------------- */
const circle = document.getElementById("circle");

function renderTimers(){
  circle.innerHTML = "";
  const diameter = Math.min(window.innerWidth,window.innerHeight)*0.8;
  circle.style.width = diameter+"px";
  circle.style.height = diameter+"px";

  const cx = diameter/2;
  const cy = diameter/2;
  const radius = diameter/2*0.75;

 state.timers.forEach((t,i)=>{
  const el = document.createElement("div");
  el.className="timer loaded";
  el.id="timer-"+i;

  el.innerHTML=`
    <div class="title">Ajastin ${i+1}</div>
    <div class="time" id="time-${i}">0:00</div>
    <div class="stats">
      <div>Kokonaisaika: <span id="total-${i}">0:00</span></div>
      <div>>15s: <span id="over15-${i}">0</span></div>
      <div>>60s: <span id="over60-${i}">0</span></div>
    </div>
    <div class="btnText" id="btnText-${i}">${t.running?"STOP":"START"}</div>
  `;

  const angle = (360/state.timerCount)*i;
  const rad = angle*Math.PI/180;
  el.style.left = (cx+radius*Math.cos(rad))+"px";
  el.style.top  = (cy+radius*Math.sin(rad))+"px";
  el.style.transform="translate(-50%,-50%)";

  circle.appendChild(el);

  // click koko timer-diviin
  el.onclick = ()=>toggleTimer(i);
  updateButton(i); // heti visuaalinen tila
});

}

/* ---------------- TIMER UPDATE ---------------- */
function updateTimersDisplay(){
  const now = performance.now();
  state.timers.forEach((t,i)=>{
    if(t.running){
      const delta = now - t.startTs;
      t.elapsed += delta;
      t.total += delta/1000;
      t.startTs = now;
    }

    const elapsedSec = Math.floor(t.elapsed/1000);
    const min = Math.floor(elapsedSec/60);
    const sec = elapsedSec%60;
    document.getElementById(`time-${i}`).textContent = `${min}:${sec.toString().padStart(2,"0")}`;

    const totalMin = Math.floor(t.total/60);
    const totalSec = Math.floor(t.total%60);
    document.getElementById(`total-${i}`).textContent = `${totalMin}:${totalSec.toString().padStart(2,"0")}`;

    if(t.elapsed>=15000 && t.elapsed-16<15000) t.over15++;
    if(t.elapsed>=60000 && t.elapsed-16<60000) t.over60++;

    document.getElementById(`over15-${i}`).textContent = t.over15;
    document.getElementById(`over60-${i}`).textContent = t.over60;
  });

  requestAnimationFrame(updateTimersDisplay);
}

/* ---------------- TOGGLE TIMER ---------------- */
function toggleTimer(i){
  const t = state.timers[i];
  const btn = document.getElementById(`btn-${i}`);
  if(t.running){
    t.running=false;
  } else {
    t.running=true;
    t.startTs=performance.now();
  }
  updateButton(i);
}

// Päivitä nappi visuaalisesti
function updateButton(i){
  const t = state.timers[i];
  const el = document.getElementById(`timer-${i}`);
  const txt = document.getElementById(`btnText-${i}`);
  if(!el || !txt) return;

  if(t.running){
    txt.textContent = "STOP";
    el.classList.add("running");
  } else {
    txt.textContent = "START";
    el.classList.remove("running");
  }
}


// renderTimers loppuun:
state.timers.forEach((t,i)=>{
  const btn = document.getElementById(`btn-${i}`);
  btn.onclick = ()=>toggleTimer(i);
  updateButton(i); // päivitys heti renderöinnissä
});


/* ---------------- SETTINGS PANEL ---------------- */
const panel   = document.getElementById("settingsPanel");
const btnOpen = document.getElementById("openSettingsBtn");
const btnClose= document.getElementById("closeSettings");
const timerCountInput = document.getElementById("timerCountInput");
const tiltLockInput   = document.getElementById("tiltLockInput");
const wakeLockInput   = document.getElementById("wakeLockInput");

btnOpen.onclick = ()=>{
  panel.classList.add("open");
  timerCountInput.value = state.timerCount;
  tiltLockInput.checked = state.tiltLock;
  wakeLockInput.checked = state.wakeLockEnabled;
};
btnClose.onclick = ()=>panel.classList.remove("open");

timerCountInput.onchange = ()=>{
  let v = Math.min(8, Math.max(2, parseInt(timerCountInput.value)));
  state.timerCount = v;
  initTimers(v);
  renderTimers();
};
tiltLockInput.onchange = ()=>state.tiltLock = tiltLockInput.checked;
wakeLockInput.onchange = ()=>state.wakeLockEnabled = wakeLockInput.checked;

/* ---------------- INIT ---------------- */
initTimers(state.timerCount);
renderTimers();
updateTimersDisplay();
window.onresize = renderTimers;
</script>
</body>
</html>
